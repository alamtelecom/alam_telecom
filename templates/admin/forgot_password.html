{% extends "admin/_base_admin.html" %}
{% block title %}Forgot Password | Alam Telecom{% endblock %}
{% block content %}
<div class="admin-card">
  <h1>Forgot Password</h1>
  <p class="admin-sub">Enter the admin email — a 6-digit code will be sent to it.</p>
  <form method="POST" class="admin-form">
    <label>Email
      <input type="email" name="email" required>
    </label>
    <button type="submit" class="btn btn-primary">Send Code</button>
  </form>
  <a class="admin-link" href="{{ url_for('admin.login') }}">Back to login</a>
</div>
{% endblock %}

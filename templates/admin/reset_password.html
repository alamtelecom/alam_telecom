{% extends "admin/_base_admin.html" %}
{% block title %}Reset Password | Alam Telecom{% endblock %}
{% block content %}
<div class="admin-card">
  <h1>Enter Code</h1>
  <p class="admin-sub">Enter the 6-digit code sent to your email, and set a new password.</p>
  <form method="POST" class="admin-form">
    <label>6-Digit Code
      <input type="text" name="otp" required maxlength="6" pattern="[0-9]{6}">
    </label>
    <label>New Password
      <input type="password" name="new_password" required minlength="6">
    </label>
    <label>Confirm New Password
      <input type="password" name="confirm_password" required minlength="6">
    </label>
    <button type="submit" class="btn btn-primary">Reset Password</button>
  </form>
  <a class="admin-link" href="{{ url_for('admin.forgot_password') }}">Resend code</a>
</div>
{% endblock %}

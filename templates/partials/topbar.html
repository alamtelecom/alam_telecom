<div class="topbar">

      <span class="topbar-ticker-track">
        <span>{{ store.hours_main }} &nbsp;&middot;&nbsp; {{ store.hours_note }} &nbsp;&middot;&nbsp; Call: {{ store.phone }}</span>
        <span>{{ store.hours_main }} &nbsp;&middot;&nbsp; {{ store.hours_note }} &nbsp;&middot;&nbsp; Call: {{ store.phone }}</span>
      </span>

      हिंदी
